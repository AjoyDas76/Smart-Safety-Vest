<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Helmet Dashboard</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Chart.js & XLSX -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #0f172a 0%, #070a12 100%);
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(0, 242, 255, 0.18);
      --glass-shine: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 100%);
      --card-glow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 242, 255, 0.05);
      --cyan: #00f2ff;
      --cyan-glow: rgba(0, 242, 255, 0.25);
      --green: #10b981;
      --red: #ff3366;
      --amber: #f59e0b;
      --purple: #a855f7;
      --yellow: #eab308;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --aside-bg: rgba(10, 15, 29, 0.92);
    }

    body.light-theme {
      --bg-gradient: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #e2e8f0 100%);
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(0, 119, 255, 0.25);
      --glass-shine: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.3) 100%);
      --card-glow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      --cyan: #0066ff;
      --cyan-glow: rgba(0, 102, 255, 0.2);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-subtle: rgba(0, 0, 0, 0.06);
      --aside-bg: rgba(255, 255, 255, 0.95);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      transition: background 0.4s ease, color 0.4s ease;
      -webkit-font-smoothing: antialiased;
    }

    .glass-panel {
      background: var(--glass-shine), var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      box-shadow: var(--card-glow);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease;
    }

    .glass-panel:hover {
      border-color: rgba(0, 242, 255, 0.35);
    }

    aside {
      width: 250px;
      background: var(--aside-bg);
      border-right: 1px solid var(--glass-border);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      z-index: 10001;
      position: fixed;
      top: 0; bottom: 0; left: -260px;
      transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 15px 0 35px rgba(0, 0, 0, 0.6);
    }

    aside.open { left: 0; }

    .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px; margin-bottom: 24px; }
    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--cyan) 0%, #0055ff 100%);
      border-radius: 10px; display: grid; place-items: center;
      color: #fff; font-size: 18px; box-shadow: 0 0 15px var(--cyan-glow);
    }
    .brand-text h1 { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 0.5px; }
    .brand-text span { font-size: 9px; color: var(--text-muted); display: block; margin-top: 2px; letter-spacing: 1px; }

    .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .nav-item a {
      display: flex; align-items: center; gap: 12px; padding: 11px 16px;
      color: var(--text-muted); text-decoration: none; border-radius: 10px; font-size: 13px; font-weight: 500;
      transition: all 0.2s ease;
    }
    .nav-item.active a, .nav-item a:hover {
      background: rgba(0, 242, 255, 0.12); color: var(--text-main);
      border: 1px solid var(--glass-border);
      transform: translateX(3px);
    }

    main {
      flex: 1; display: flex; flex-direction: column;
      padding: 18px 22px; gap: 14px; width: 100%; min-width: 0;
    }

    .card { padding: 16px; position: relative; width: 100%; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; flex-wrap: wrap; gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }

    .nav-toggle { 
      color: var(--cyan); font-size: 18px; cursor: pointer; padding: 8px 12px;
      border-radius: 8px; border: 1px solid var(--glass-border);
      background: rgba(0, 242, 255, 0.05);
      transition: background 0.2s ease;
    }
    .nav-toggle:hover { background: rgba(0, 242, 255, 0.15); }

    .cmd-title { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 6px; font-size: 10px;
      font-family: 'Orbitron', sans-serif; color: var(--amber);
      background: rgba(245, 158, 11, 0.12); padding: 5px 12px; border-radius: 20px;
      border: 1px solid rgba(245, 158, 11, 0.3); font-weight: 600;
    }
    .status-badge.connected { color: var(--green); background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.3); }

    .header-right { display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .clock-box { font-family: 'Orbitron', sans-serif; display: flex; align-items: center; gap: 8px; color: var(--text-main); font-weight: 600; }

    .btn-action {
      background: rgba(0, 242, 255, 0.08); border: 1px solid var(--glass-border);
      color: var(--text-main); padding: 8px 14px; border-radius: 10px;
      cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-action:hover { background: rgba(0, 242, 255, 0.18); border-color: var(--cyan); transform: translateY(-1px); }

    .row { display: flex; gap: 14px; width: 100%; flex-wrap: wrap; }
    .card-title {
      font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .system-card { flex: 1.8; min-width: 250px; display: flex; align-items: center; gap: 18px; }
    .system-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: rgba(245, 158, 11, 0.1); border: 1px solid var(--amber);
      display: grid; place-items: center; color: var(--amber); font-size: 22px; flex-shrink: 0;
    }
    .system-icon.active { background: rgba(16, 185, 129, 0.1); border-color: var(--green); color: var(--green); }
    .system-text h2 { font-family: 'Orbitron', sans-serif; font-size: 15px; color: var(--amber); font-weight: 800; }
    .system-text h2.active { color: var(--green); }
    .system-text h3 { font-size: 12px; font-weight: 700; color: var(--text-main); margin-top: 3px; }
    .system-text p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .sos-card {
      flex: 0.8; min-width: 130px; background: radial-gradient(circle at center, rgba(255,0,85,0.2) 0%, rgba(15,23,42,0.7) 100%);
      border: 1px solid rgba(255,0,85,0.5); text-align: center; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer; padding: 14px;
      transition: all 0.3s ease;
    }
    .sos-card:hover { transform: translateY(-2px); border-color: var(--red); }
    .sos-btn {
      width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.1);
      color: #fff; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 14px;
      display: grid; place-items: center; box-shadow: 0 0 12px rgba(255,0,85,0.2); border: 2px solid rgba(255,255,255,0.4);
      transition: all 0.25s ease;
    }

    .sos-btn.active {
      background: var(--red);
      border-color: #fff;
      animation: sosPulse 1.1s ease-in-out infinite;
    }

    .sos-card.active {
      background: radial-gradient(circle at center, rgba(255,0,85,0.45) 0%, rgba(13,25,44,0.6) 100%);
      border-color: var(--red);
      animation: sosCardGlow 1.1s ease-in-out infinite;
    }

    @keyframes sosPulse {
      0%   { box-shadow: 0 0 12px var(--red), 0 0 0 0 rgba(255,51,102,0.55); }
      70%  { box-shadow: 0 0 22px var(--red), 0 0 0 14px rgba(255,51,102,0); }
      100% { box-shadow: 0 0 12px var(--red), 0 0 0 0 rgba(255,51,102,0); }
    }

    @keyframes sosCardGlow {
      0%, 100% { box-shadow: var(--card-glow); }
      50% { box-shadow: 0 0 26px 4px rgba(255,51,102,0.45); }
    }

    .worker-info-card { flex: 2; min-width: 260px; display: flex; align-items: center; gap: 16px; }
    .worker-avatar {
      width: 48px; height: 48px; border-radius: 12px; background: rgba(0,242,255,0.08);
      border: 1px solid var(--cyan); display: grid; place-items: center; color: var(--cyan); font-size: 20px; flex-shrink: 0;
    }
    .worker-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; font-size: 12px; width: 100%; }
    .worker-details span { color: var(--text-muted); }

    .sensor-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; width: 100%; }
    .sensor-card-v2 {
      padding: 14px 12px 4px 12px; display: flex; flex-direction: column;
      justify-content: space-between; height: 155px; position: relative; overflow: hidden;
    }
    .sensor-card-v2:hover { transform: translateY(-3px); }
    .sensor-body-v2 { display: flex; gap: 10px; align-items: flex-start; }
    .sensor-icon-box { font-size: 24px; display: flex; align-items: center; justify-content: center; min-width: 30px; }
    .sensor-info-box { display: flex; flex-direction: column; flex: 1; }
    .sensor-title-v2 { font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; }
    .sensor-val-v2 { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 800; color: var(--text-main); display: flex; align-items: baseline; gap: 3px; margin-top: 2px; }
    .sensor-val-v2 small { font-size: 11px; color: var(--cyan); font-weight: 600; }
    .sensor-status-v2 { font-size: 11px; font-weight: 600; color: var(--amber); margin-top: 2px; }
    .sensor-range-v2 { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
    .sparkline-box-v2 { height: 42px; width: 108%; margin-left: -4%; }

    .battery-bar-container { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .battery-bar-fill { height: 100%; width: 0%; background: var(--amber); border-radius: 3px; transition: width 0.4s ease; }

    .col-flex-1 { flex: 1; min-width: 240px; }
    .col-flex-2 { flex: 2; min-width: 280px; }
    .col-flex-1-5 { flex: 1.5; min-width: 260px; }

    .device-conn-list { display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
    .device-item { display: flex; justify-content: space-between; align-items: center; }
    .device-name { display: flex; align-items: center; gap: 10px; }
    .device-name i { color: var(--cyan); width: 16px; text-align: center; }
    .signal-bar-box { margin-top: 12px; border-top: 1px solid var(--border-subtle); padding-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }

    .chart-box { height: 195px; position: relative; width: 100%; }

    .map-wrapper { position: relative; width: 100%; height: 195px; border-radius: 10px; overflow: hidden; cursor: pointer; }
    #map { height: 100%; width: 100%; z-index: 1; }
    .map-overlay-btn {
      position: absolute; top: 10px; right: 10px; z-index: 500;
      background: rgba(5, 11, 20, 0.85); color: var(--cyan); border: 1px solid var(--cyan);
      font-size: 9px; font-family: 'Orbitron', sans-serif; padding: 5px 10px; border-radius: 6px;
      backdrop-filter: blur(4px); transition: all 0.2s ease;
    }
    .map-wrapper:hover .map-overlay-btn { background: var(--cyan); color: #000; }

    .map-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); z-index: 99999;
      justify-content: center; align-items: center; padding: 20px;
    }
    .map-modal.active { display: flex; }
    .map-modal-content {
      width: 100%; height: 100%; background: var(--aside-bg); border: 1px solid var(--glass-border);
      border-radius: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .map-modal-header {
      padding: 12px 18px; display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--border-subtle); z-index: 100000;
    }
    .map-modal-header h3 { font-family: 'Orbitron', sans-serif; font-size: 12px; color: var(--cyan); letter-spacing: 0.5px; }
    .close-modal-btn {
      background: rgba(255, 51, 102, 0.15); border: 1px solid var(--red); color: var(--red);
      font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600;
      transition: all 0.2s ease;
    }
    .close-modal-btn:hover { background: var(--red); color: #fff; }
    #fullMap { flex: 1; width: 100%; height: 100%; z-index: 1; }

    .table-container { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 260px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--border-subtle); text-align: left; }
    th { color: var(--text-muted); font-weight: 600; font-size: 10px; font-family: 'Orbitron', sans-serif; }

    .badge { padding: 3px 7px; border-radius: 6px; font-size: 8px; font-weight: 700; font-family: 'Orbitron', sans-serif; display: inline-block; }
    .badge-safe { background: rgba(16,185,129,0.12); color: var(--green); border: 1px solid rgba(16,185,129,0.4); }
    .badge-alert { background: rgba(255,51,102,0.12); color: var(--red); border: 1px solid rgba(255,51,102,0.4); }

    .alert-card { border: 1px solid rgba(255,0,85,0.4); background: rgba(255,0,85,0.05); }
    .alert-count { background: var(--red); color: #fff; font-size: 9px; padding: 2px 7px; border-radius: 12px; font-weight: 800; }

    .active-alert-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; margin-bottom: 8px; border-radius: 12px;
      background: rgba(255, 51, 102, 0.12); border: 1px solid var(--red);
      animation: alertItemPulse 1.4s ease-in-out infinite;
    }
    .active-alert-item:last-child { margin-bottom: 0; }
    .active-alert-icon {
      font-size: 24px; color: var(--red); flex-shrink: 0;
      width: 32px; text-align: center;
    }
    .active-alert-text { flex: 1; min-width: 0; }
    .active-alert-title {
      font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 800;
      color: var(--red); text-transform: uppercase; letter-spacing: 0.3px;
    }
    .active-alert-detail { font-size: 11px; color: var(--text-main); margin-top: 3px; }

    @keyframes alertItemPulse {
      0%, 100% { box-shadow: 0 0 0 rgba(255, 51, 102, 0); }
      50% { box-shadow: 0 0 16px rgba(255, 51, 102, 0.4); }
    }

    footer { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--text-muted); padding: 10px 4px; flex-wrap: wrap; gap: 6px; }

    @media (max-width: 1200px) { .sensor-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) {
      main { padding: 10px; gap: 10px; }
      header { padding: 10px 14px; gap: 8px; }
      .header-right { width: 100%; justify-content: space-between; }
      .cmd-title { font-size: 13px; }
      .sensor-grid { grid-template-columns: repeat(2, 1fr); }
      .row { flex-direction: column; gap: 10px; }
      .col-flex-1, .col-flex-2, .col-flex-1-5, .system-card, .sos-card, .worker-info-card { width: 100%; flex: auto; }
      .worker-details { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .map-modal { padding: 0; }
      .map-modal-content { border-radius: 0; }
    }
    @media (max-width: 480px) {
      .sensor-grid { grid-template-columns: 1fr; }
      .worker-details { grid-template-columns: 1fr; }
      .system-card { flex-direction: row; text-align: left; }
      .worker-info-card { flex-direction: row; }
    }
  </style>
</head>
<body>

  <!-- Navigation Sidebar -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-hard-hat"></i></div>
      <div class="brand-text">
        <h1>SMART HELMET</h1>
        <span>COMMAND CENTER</span>
      </div>
    </div>
    
    <ul class="nav-menu">
      <li class="nav-item active"><a href="#"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
      <li class="nav-item"><a href="#"><i class="fa-solid fa-users"></i> Workers</a></li>
      <li class="nav-item"><a href="#"><i class="fa-solid fa-triangle-exclamation"></i> Alert History</a></li>
      <li class="nav-item"><a href="#"><i class="fa-solid fa-map-location-dot"></i> Live Map</a></li>
      <li class="nav-item"><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
    </ul>
  </aside>

  <!-- Main Content Area -->
  <main>
    <!-- Top Header -->
    <header class="glass-panel">
      <div class="header-left">
        <div class="nav-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></div>
        <div class="cmd-title">MINING ZONE A - MONITORING</div>
        <div class="status-badge" id="connBadge">
          <i class="fa-solid fa-circle" style="font-size: 8px;"></i> <span id="connText">CONNECTING...</span>
        </div>
      </div>
      
      <div class="header-right">
        <div class="clock-box"><i class="fa-regular fa-clock" style="color: var(--cyan);"></i> <span id="clock">00:00:00 AM</span></div>
        <button class="btn-action" id="themeBtn"><i class="fa-solid fa-moon"></i> Theme</button>
        <button class="btn-action" id="exportBtn"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
        <button class="btn-action" id="audioToggleBtn" title="Toggle Alarm Mute" style="border-color: rgba(0, 242, 255, 0.4);">
          <i class="fa-solid fa-volume-high" id="audioIcon" style="color: var(--cyan);"></i>
        </button>
      </div>
    </header>

    <!-- Top Status Row -->
    <div class="row">
      <!-- Helmet Connection Status Card -->
      <div class="card glass-panel system-card">
        <div class="system-icon" id="sysIcon"><i class="fa-solid fa-shield-cat"></i></div>
        <div class="system-text">
          <h2 id="sysStatus">OFFLINE</h2>
          <h3 id="helmetIdDisplay">HELMET ID: --</h3>
          <p id="sysSub">Waiting for sensor node telemetry data...</p>
        </div>
      </div>

      <!-- Emergency SOS Card -->
      <div class="card glass-panel sos-card" id="sosCard">
        <div class="card-title" style="margin-bottom: 6px; width: 100%;"><span>EMERGENCY
