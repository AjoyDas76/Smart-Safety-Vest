<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #ffffff;
    }

    /* Main Dashboard Container */
    .dashboard {
      width: 100%;
      max-width: 800px; /* নির্দিষ্ট উইডথ দেওয়া হয়েছে যাতে বেশি ডানে না ছড়ায় */
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Glassmorphism Common Style */
    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Primary Grid (Top Row) */
    .primary-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    /* Secondary Stack (Bottom Section) */
    .secondary-metrics {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .metric-value {
      font-size: 2rem;
      font-weight: bold;
      margin-top: 5px;
    }

    .unit {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Progress bar styling for indicators */
    .bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    
    <!-- Top Row: Temperature, Humidity, Pressure -->
    <div class="primary-metrics">
      <div class="glass-card">
        <div class="section-title">Temperature</div>
        <div class="metric-value">28.5 <span class="unit">°C</span></div>
      </div>
      
      <div class="glass-card">
        <div class="section-title">Humidity</div>
        <div class="metric-value">62 <span class="unit">%</span></div>
      </div>
      
      <div class="glass-card">
        <div class="section-title">Pressure</div>
        <div class="metric-value">1013 <span class="unit">hPa</span></div>
      </div>
    </div>

    <!-- Bottom Stack: Gas Quality, Heart Rate, Battery Level -->
    <div class="secondary-metrics">
      
      <div class="glass-card">
        <div class="section-title">Gas Quality</div>
        <div class="metric-value"> Good <span class="unit">(42 AQI)</span></div>
        <div class="bar-container">
          <div class="bar-fill" style="width: 85%; background: #4ade80;"></div>
        </div>
      </div>

      <div class="glass-card">
        <div class="section-title">Heart Rate</div>
        <div class="metric-value">75 <span class="unit">BPM</span></div>
        <div class="bar-container">
          <div class="bar-fill" style="width: 70%; background: #f43f5e;"></div>
        </div>
      </div>

      <div class="glass-card">
        <div class="section-title">Battery Level</div>
        <div class="metric-value">88 <span class="unit">%</span></div>
        <div class="bar-container">
          <div class="bar-fill" style="width: 88%; background: #38bdf8;"></div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
